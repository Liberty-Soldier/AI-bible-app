name: Linux production build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-production-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: npm run build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete production build
        run: npm run build
